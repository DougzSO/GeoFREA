# deferred_checks.yaml — content check of a country against a reference manifest (D-core-050; src/geofrea/core/deferred_check.py).
#
# COMMANDS 75 to 77 made the pipeline faster without changing what it computes. PRT was proved equal by content hash, artifact by artifact; IND and BRA
# are proved by this file: the first time the pipeline executes a listed phase for them, the content hash of each artifact of the phase is compared with
# the manifest saved before the change. A difference that no change of configuration explains stops the run before the next phase and is written, with
# its probable cause, to outputs/<ISO>/deferred_check.json. A phase that matched is settled and is not compared again. Delete a country to retire its check.
#
# baseline: `latest`, or the manifest.json of the country as it was before the change, relative to the data root. `latest` is the manifest of the round `reference_run`
#           of the reference store: what the pipeline last accepted. `expected` declares, since 2026-11-06 (COMMAND 101), the differences by design of the slope from FABDEM and of what follows from it (see the entries of each country).
#           (outputs/<ISO>/unattended/20261029_135838/manifest_before.json: saved by scripts/run_unattended.ps1 before the first unattended round)
# phases:   the phases to compare (F1 to F5 and the figure phases that follow)
# expected: an artifact whose difference is accepted without a change of configuration, and why; the phase is then EXPLICADO_REVISAR
#           An entry is pinned to the reference it was declared against: a text (its pin is the country's `expected_reference_run`) or {reason, reference_run}.
#           It counts only while that round is the reference (`latest` resolved); when `latest` moves on it is expired, the gate warns and does not apply it, and
#           `python scripts/list_expired_expected.py` lists what to remove. An entry with no pin is refused.
# reference_run: the round of the reference store (GeoFREA_data/references/, core.reference_store) whose files the rasters are compared with: a run_id, or
#           `latest`, the last round accepted (default; the state of 2026-11-04 of PRT, IND and BRA is the first one). A raster whose hash differs and that has a file there is compared with it by tolerance
#           (core.equivalence); if it is equivalent the difference is a last bit of a float and needs no entry in `expected` (verdict EQUIVALENTE, COMMAND 91).
#           A raster with no file there, or outside the tolerance, still stops the run. The rounds seed_20261102_<ISO> (imported from backup_before_89 with
#           scripts/seed_references.py) are historical: kept, not deleted, and pinnable with `reference_run: seed_20261102_<ISO>`.
# reference_store: what the store keeps of an accepted round: the JSON artifacts (the summaries) of every phase and the rasters of `raster_phases`.

reference_store:
  root: references
  suffixes: [".json"]
  raster_phases: [grid_alignment, siting_layers]


countries:
  IND:
    baseline: latest
    reference_run: latest
    phases: &phases
      - data_acquisition
      - data_quality_audit
      - grid_alignment
      - siting_layers
      - land_eligibility
      - external_inputs
      - climate_forcing
      - hazard_context
      - climate_maps
      - overview
      - technical_potential
      - potential_maps
