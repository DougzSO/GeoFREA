# GeoFREA experiments configuration — METHODOLOGY Section 9, U-01 to U-06
#
# Futures design: climate members, time windows, uncertain parameters,
# sampler configuration, land-availability variants, and output thresholds.
# This is a skeleton with keys from METHODOLOGY Section 9; values that depend
# on open questions are null with the OQ ID in comments.

# Climate members (U-01)
# Full factorial of GCM × SSP × window. Reference member has no climate change.
members:
  reference:
    gcm: null  # No model — actual climate period
    ssp: null  # No scenario
    window: "1995-2014"
    description: "Reference climatology (IPCC AR6 baseline)"

  # To be populated via M-F4-02: GCM selection protocol at F4 implementation
  # For each selected model and SSP × window combination:
  # - m_<gcm>_<ssp>_<window>: {gcm: <name>, ssp: "SSP1-2.6"|"SSP3-7.0"|"SSP5-8.5", window: "2041-2070"|"2071-2100"}
  # Example (not yet implemented):
  # m_gfdl_esm4_ssp3_70_2041_2070:
  #   gcm: "GFDL-ESM4"
  #   ssp: "SSP3-7.0"
  #   window: "2041-2070"

# GCM ensemble (M-F4-02, OQ-009 verdict 2026-10-06, option C; evidence docs/_audit/2026-10_gcm_selection_j1.md).
# Members are the full factorial gcm x ssp x window (U-01): 6 x 3 x 2 = 36. F4 expands this list into
# members.yaml (M-F4-06) with provenance. `hazard_channel` = ISIMIP3b counterpart exists (D-F4-003/004).
gcm_ensemble:
  # OQ-042 option A (Douglas, 2026-10-06): delta_wind is the ratio of n x n native-cell neighbourhood means of the
  # window and reference annual means, so a near-zero reference wind in one cell (MIROC6 over the Amazon) cannot
  # make the ratio explode. delta_rsds and dT keep the per-cell definition. 3 = the interpolation footprint.
  wind_ratio_neighbourhood_cells: 3
  # OQ-042 option C (Douglas, 2026-10-06): a cell-member whose delta_wind falls outside this range is MASKED: no row
  # in forcing.parquet, the member is absent in that cell, and the cell-member is listed in forcing_masked.parquet
  # with the value that was rejected. No value is invented. The range is a plausibility bound for a 30-year change in
  # mean wind speed and has NO source (flagged unsourced, like distance_cap_km; tracked as OQ-043 with its sensitivity,
  D-F4-018: only BRA is sensitive, 1.0% masked at 0.4-1.6 to 4.3% at 0.7-1.3); revisit if a better option is chosen.
  wind_factor_valid_range: [0.5, 1.5]
  # Hazard channel (ISIMIP3b tasmax/pr, D-F4-001/002): windows whose daily data are on disk. 2071-2100 was accepted in
  # D-F4-002 but has NOT been acquired (the CRAEI archive holds 2041-2070 only; ~183 GB), so members of that window have
  # a resource row and NO hazard row, declared per member in members.yaml (D-F4-004).
  hazard_windows_available: ["2041-2070"]
  ssps: ["SSP1-2.6", "SSP3-7.0", "SSP5-8.5"]
  windows: ["2041-2070", "2071-2100"]
  gcms:
    - {name: "GFDL-ESM4",    cds_name: "gfdl_esm4",    tcr_ar6_k: null, hazard_channel: true,  note: "S-04 mandatory; no TCR in AR6 Table 7.SM.5"}
    - {name: "MIROC6",       cds_name: "miroc6",       tcr_ar6_k: 1.55, hazard_channel: false, note: "S-04 mandatory"}
    - {name: "ACCESS-CM2",   cds_name: "access_cm2",   tcr_ar6_k: 2.10, hazard_channel: false}
    - {name: "IPSL-CM6A-LR", cds_name: "ipsl_cm6a_lr", tcr_ar6_k: 2.32, hazard_channel: true,  tcr_exception: true, note: "above the likely TCR range; kept by M-F4-02 item 5"}
    - {name: "CNRM-CM6-1",   cds_name: "cnrm_cm6_1",   tcr_ar6_k: 2.14, hazard_channel: false}
    - {name: "MRI-ESM2-0",   cds_name: "mri_esm2_0",   tcr_ar6_k: 1.64, hazard_channel: true}

# Time windows (M-F4-01, S-05)
windows:
  # Historical reference climatology (M-F4-03: delta change base period)
  reference:
    start_year: 1995
    end_year: 2014

  # Core projection window (S-05: central scenario 2041-2070)
  core:
    start_year: 2041
    end_year: 2070

  # Sensitivity window (S-05: future repowering / second-generation assets)
  # Analyzed as a sensitivity check, not part of the core hypothesis testing
  sensitivity:
    start_year: 2071
    end_year: 2100

# Uncertain parameters (U-03: default set)
# Each entry is a parameter key that exists in config/parameters.json and
# has a non-null range in experiments.yaml.uncertain_parameters (validated at load).
# Parameters marked as non-uncertain (range=null in parameters.json) must NOT appear here.
uncertain_parameters:
  capex_usd_per_kw:
    description: "Capital expenditure, USD/kW installed"
  opex_fixed_frac:
    description: "Fixed O&M as fraction of CAPEX per year"
  discount_rate:
    description: "Technology-specific real discount rate"
  lifetime_years:
    description: "Asset operational lifetime"
  degradation_rate:
    description: "Annual capacity degradation (technology-dependent)"
  grid_cost_usd_per_mw_km:
    description: "Transmission interconnection cost per MW·km"
  substation_cost_usd_per_mw:
    description: "Substation / POI cost per MW"
  road_cost_usd_per_km:
    description: "Road access / construction cost per km"
  gamma:
    description: "Solar module temperature coefficient (1/K, negative)"
  eta_loss:
    description: "Wind availability + wake losses (fraction)"

# Sampler configuration (U-02, U-04)
sampler:
  # Method: Latin hypercube sampling (U-02)
  method: "latin_hypercube"

  # Seed for reproducibility (A-12, M-F6-02)
  # Fixed seed ensures determinism across reruns (same configuration, same samples)
  seed: 42

  # Sample size (U-04: convergence protocol)
  # Start at 500, double until Jaccard(top-k) change < 0.01 for all countries/techs
  # Once converged, record the adopted size here (along with the convergence analysis
  # in the F6 phase record)
  initial_size: 500
  # max_size_for_convergence: null  # Pending U-04 protocol completion

# Land-availability variants (U-06)
# Alternative exclusion parameter sets for sensitivity analysis
# Only "central" feeds F4-F7 (core analysis); variants feed T-R2 and E1 only
land_variants:
  # Central (default) exclusion set from M-F2b-01
  central:
    description: "Standard exclusion set (M-F2b-01 E1-E6)"
    # E4 slope threshold per technology (degrees)
    # E3 riparian buffer (km)
    # E2 water bodies (binary exclusion)
    # E6 population density threshold (persons/km²)
    # E5 land cover excluded classes (per land-cover table)
    # E1 IUCN protected categories (see config/parameters.json criteria.iucn_strict_categories)

  strict:
    description: "Stricter exclusion criteria (tighter thresholds)"
    # Applied only in T-R2 and E1 sensitivity tables
    # Specific thresholds pending phase specification; typically:
    # - Reduced riparian buffer (e.g., 1.0 km instead of 0.5 km) — OQ-025
    # - Higher population density threshold
    # - Expanded land-cover exclusions (e.g., grassland / cropland included)

  lenient:
    description: "Relaxed exclusion criteria (looser thresholds)"
    # Applied only in T-R2 and E1 sensitivity tables
    # Specific thresholds pending phase specification; typically:
    # - Increased riparian buffer (e.g., 0.1 km instead of 0.5 km)
    # - Lower population density threshold
    # - Reduced land-cover exclusions

# Land-availability parameters as ranges (E1-E6, minimum area; Douglas, 2026-10-07)
# Each continuous parameter has a central value (`nominal`, feeds F4-F7) and, where a source gives one, a `low`-`high` range;
# a parameter without a sourced range keeps low/high null and is held at nominal (declared, not filled in). Categorical
# parameters are named `levels`. Sources and the evidence behind every value: docs/_audit/2026-10_f3_parameter_research.md.
# This block is meant to replace the strict/lenient `land_variants` above once METHODOLOGY U-06 is changed (awaiting Douglas).
land_availability:
  technologies:
    solar:
      slope_max_deg:
        nominal: 10.0
        unit: degrees
        source: "MAPRE site-suitability set (Patankar et al., arXiv:2211.05062, Table B1; Owusu-Obeng et al., arXiv:2401.16626; both cite Leslie et al. and Wu et al.)"
        status: range_pending
        note: "Range leads not opened: 3.1 deg (85% of the 100 largest operating PV sites) and 14.04 deg (25%)."
      pop_density_max_per_km2:
        nominal: 200.0
        low: 150.0
        high: 300.0
        unit: persons/km2
        source: "range 150-300 set by Douglas on 2026-10-07 (an example, not a citation) after the 100 persons/km2 of MAPRE (Table B1, US West) excluded 78% of IND; nominal 200 is the earlier project value (parameters.json pop_density_threshold, DECISIONS 2026-09-10)"
        status: range_set_by_douglas_unsourced
        note: "Literature range still to be found (OQ-047); 100 persons/km2 (MAPRE) is below the range."
      riparian_setback_km:
        nominal: 0.5
        low: 0.25
        high: 1.0
        unit: km
        source: "MAPRE Table B1 (250 m, water bodies and rivers); McKenna et al. 2022 Table 2 (water bodies 0-1 km); nominal = earlier unverified value (Brazilian Forest Code scale)"
        status: sourced
        note: "Computed at 100 m and aggregated as an excluded share per 0.01 degree pixel (OQ-045, option c)."
      min_eligible_area_km2:
        nominal: 0.1
        unit: km2
        source: "ENSPRESO 2 (JRC144438): 10 ha suitable land for one 3 MW turbine; applied to solar by analogy (no solar source)"
        status: range_pending
      excluded_classes:
        nominal: cropland_excluded
        levels:
          cropland_excluded: [10, 40, 50, 70, 80, 90, 95]
          cropland_allowed: [10, 50, 70, 80, 90, 95]
        source: "ESMAP Global PV Potential by Country (forests, cropland, water, urban); ENSPRESO 2 key (wetlands, snow); cropland excluded by Douglas, 2026-10-07 (conservative: land in use)"
        status: sourced
      iucn_categories:
        nominal: all_designated
        levels:
          ia_ib_ii: [ia, ib, ii]
          ia_ib: [ia, ib]
          all_assigned: [ia, ib, ii, iii, iv, v, vi]
          all_designated: ['*']  # every WDPA polygon, also those with no IUCN category (Not Reported: most of Natura 2000)
        source: "central = every designation, Douglas 2026-10-07 (conservative: do not understate protection; most PRT sites are Not Reported). ESMAP excludes every IUCN status; ENSPRESO 2 excludes Natura 2000 plus 500 m; Franke et al. 2024 (Enertile) via Brooks et al., arXiv:2511.23339 use Ia, Ib, II only"
        status: sourced
        note: "The ia_ib level has no source (candidate)."
    wind:
      slope_max_deg:
        nominal: 16.7
        low: 10.2
        high: 30.0
        unit: degrees
        source: "30% = 16.7 deg (Ryberg et al. 2020, quoted by ENSPRESO 2, JRC144438); low 18% = 10.2 deg (ENSPRESO 2); high 30 deg (upper end of McKenna et al. 2022 Table 2, 1-30 deg)"
        status: sourced
      pop_density_max_per_km2:
        nominal: 200.0
        low: 150.0
        high: 300.0
        unit: persons/km2
        source: "same as solar"
        status: range_set_by_douglas_unsourced
      riparian_setback_km:
        nominal: 0.5
        low: 0.25
        high: 1.0
        unit: km
        source: "same as solar"
        status: sourced
        note: "Computed at 100 m and aggregated as an excluded share per 0.01 degree pixel (OQ-045, option c)."
      min_eligible_area_km2:
        nominal: 0.1
        unit: km2
        source: "ENSPRESO 2 (JRC144438): 10 ha suitable land for one 3 MW turbine"
        status: range_pending
      excluded_classes:
        nominal: forest_excluded
        levels:
          forest_excluded: [10, 50, 70, 80, 90, 95]
          forest_allowed: [50, 70, 80, 90, 95]
          forest_and_cropland_excluded: [10, 40, 50, 70, 80, 90, 95]
        source: "ENSPRESO 2 land-cover key (forest, wetlands, water excluded; arable land and pasture allowed); McKenna et al. 2022 (forest from full exclusion to partial allowance)"
        status: sourced
      iucn_categories:
        nominal: all_designated
        levels:
          ia_ib_ii: [ia, ib, ii]
          ia_ib: [ia, ib]
          all_assigned: [ia, ib, ii, iii, iv, v, vi]
          all_designated: ['*']  # every WDPA polygon, also those with no IUCN category (Not Reported: most of Natura 2000)
        source: "same as solar"
        status: sourced
        note: "The ia_ib level has no source (candidate)."

# Output thresholds (M-F7-04, M-F7-05)
thresholds:
  # Satisficing LCOE threshold (M-F7-04)
  # tau[country, tech] = maximum acceptable LCOE for satisficing robustness
  # OQ-008: Per-country and technology thresholds pending review
  satisficing_lcoe_usd_per_mwh:
    # Format: {country: {technology: threshold_value}}
    # Example (not yet implemented):
    # PRT:
    #   solar: 50  # USD/MWh
    #   wind: 60

  # Top-k threshold (M-F7-05)
  # Either:
  #   - fixed p_k (0 < p_k <= 1): top p_k share of candidate cells by count
  #   - capacity_target_gw: minimum national capacity to identify top-k
  # OQ-021: Decision between fixed vs. capacity-driven top-k
  top_k_percent: null  # Pending OQ-021 (fixed approach)
  top_k_capacity_gw: null  # Pending OQ-021 (capacity approach)

  # Feasibility threshold (M-F7-01)
  # Capacity factor minimum for a cell to be feasible
  # OQ-009: Per-technology CF_min
  capacity_factor_min:
    # solar: null  # Pending OQ-009
    # wind: null

  # Regret quantile (M-F7-02)
  # q_ref for the "optimal" LCOE definition (default 0 = minimum)
  # OQ-020: Decision on q_ref
  regret_quantile: 0  # Pending OQ-020 (currently fixed at minimum)

