# GeoFREA experiments configuration — METHODOLOGY Section 9, U-01 to U-06
#
# Futures design: climate members, time windows, uncertain parameters,
# sampler configuration, land-availability variants, and output thresholds.
# This is a skeleton with keys from METHODOLOGY Section 9; values that depend
# on open questions are null with the OQ ID in comments.

# Climate members (U-01)
# Full factorial of GCM × SSP × window. Reference member has no climate change.
members:
  reference:
    gcm: null  # No model — actual climate period
    ssp: null  # No scenario
    window: "1995-2014"
    description: "Reference climatology (IPCC AR6 baseline)"

  # To be populated via M-F4-02: GCM selection protocol at F4 implementation
  # For each selected model and SSP × window combination:
  # - m_<gcm>_<ssp>_<window>: {gcm: <name>, ssp: "SSP1-2.6"|"SSP3-7.0"|"SSP5-8.5", window: "2041-2070"|"2071-2100"}
  # Example:
  # m_gfdl_esm4_ssp3_70_2041_2070:
  #   gcm: "GFDL-ESM4"
  #   ssp: "SSP3-7.0"
  #   window: "2041-2070"

# GCM ensemble (M-F4-02, OQ-009 verdict 2026-10-06, option C; evidence docs/_audit/2026-10_gcm_selection_j1.md).
# Members are the full factorial gcm x ssp x window (U-01): 6 x 3 x 2 = 36. F4 expands this list into
# members.yaml (M-F4-06) with provenance. `hazard_channel` = ISIMIP3b counterpart exists (D-F4-003/004).
gcm_ensemble:
  # OQ-042 option A (Douglas, 2026-10-06): delta_wind is the ratio of n x n native-cell neighbourhood means of the
  # window and reference annual means, so a near-zero reference wind in one cell (MIROC6 over the Amazon) cannot
  # make the ratio explode. delta_rsds and dT keep the per-cell definition. 3 = the interpolation footprint.
  wind_ratio_neighbourhood_cells: 3
  # OQ-042 option C (Douglas, 2026-10-06): a cell-member whose delta_wind falls outside this range is MASKED: no row
  # in forcing.parquet, the member is absent in that cell, and the cell-member is listed in forcing_masked.parquet
  # with the value that was rejected. No value is invented. The range is a plausibility bound for a 30-year change in
  # mean wind speed and has NO source (flagged unsourced, like distance_cap_km; tracked as OQ-043 with its sensitivity,
  D-F4-018: only BRA is sensitive, 1.0% masked at 0.4-1.6 to 4.3% at 0.7-1.3); revisit if a better option is chosen.
  wind_factor_valid_range: [0.5, 1.5]
  # V-82 (Douglas, 2026-10-14): a native cell whose dT departs from the median of its eight neighbours by more than this many K is flagged,
  # and every cell interpolated from it carries `dT_isolated_native_cell` in forcing.parquet; nothing is corrected (METHODOLOGY M-F4-06).
  dt_isolated_native_cell_threshold_k: 1.0
  # Hazard channel (ISIMIP3b tasmax/pr, D-F4-001/002): windows whose daily data are on disk. 2071-2100 was accepted in
  # D-F4-002 but has NOT been acquired (the CRAEI archive holds 2041-2070 only; ~183 GB), so members of that window have
  # a resource row and NO hazard row, declared per member in members.yaml (D-F4-004).
  hazard_windows_available: ["2041-2070"]
  ssps: ["SSP1-2.6", "SSP3-7.0", "SSP5-8.5"]
  windows: ["2041-2070", "2071-2100"]
  gcms:
    - {name: "GFDL-ESM4",    cds_name: "gfdl_esm4",    tcr_ar6_k: null, hazard_channel: true,  note: "S-04 mandatory; no TCR in AR6 Table 7.SM.5"}
    - {name: "MIROC6",       cds_name: "miroc6",       tcr_ar6_k: 1.55, hazard_channel: false, wind_channel: false, note: "S-04 mandatory; wind channel excluded by M-F4-02 item 6 (reference 10 m wind over Brazil is not physically plausible: docs/_audit/2026-10_data_diagnostics.md section 2); rsds and tas are kept"}
    - {name: "ACCESS-CM2",   cds_name: "access_cm2",   tcr_ar6_k: 2.10, hazard_channel: false}
    - {name: "IPSL-CM6A-LR", cds_name: "ipsl_cm6a_lr", tcr_ar6_k: 2.32, hazard_channel: true,  tcr_exception: true, note: "above the likely TCR range; kept by M-F4-02 item 5"}
    - {name: "CNRM-CM6-1",   cds_name: "cnrm_cm6_1",   tcr_ar6_k: 2.14, hazard_channel: false}
    - {name: "MRI-ESM2-0",   cds_name: "mri_esm2_0",   tcr_ar6_k: 1.64, hazard_channel: true}

# Time windows (M-F4-01, S-05)
windows:
  # Historical reference climatology (M-F4-03: delta change base period)
  reference:
    start_year: 1995
    end_year: 2014

  # Core projection window (S-05: central scenario 2041-2070)
  core:
    start_year: 2041
    end_year: 2070

  # Sensitivity window (S-05: future repowering / second-generation assets)
  # Analyzed as a sensitivity check, not part of the core hypothesis testing
  sensitivity:
    start_year: 2071
    end_year: 2100

# Uncertain parameters (U-03: default set)
# Each entry is a parameter key that exists in config/parameters.json and
# has a non-null range (U-05); `core/production.py` checks both (audit_parameters, validate_registry).
# Parameters marked as non-uncertain (range=null in parameters.json) must NOT appear here.
uncertain_parameters:
  capex_usd_per_kw:
    description: "Capital expenditure, USD/kW installed"
  opex_fixed_frac:
    description: "Fixed O&M as fraction of CAPEX per year"
  discount_rate:
    description: "Technology-specific real discount rate"
  lifetime_years:
    description: "Asset operational lifetime"
  degradation_weight:
    description: "Position in [0, 1] between the lower and the upper degradation bound of the cell (PV: median to mean of its thermal zone; wind: newer to older vintages)"
  line_cost_usd_per_km:
    description: "Cost of the connection line to the point of interconnection, 2024 USD per km (per project)"
  bay_cost_usd:
    description: "Cost of the connection works at the receiving substation, 2024 USD per project"
  road_cost_usd_per_km:
    description: "Access road cost, 2024 USD per km (per project)"
  tortuosity_grid:
    description: "Ratio of the routed connection length to the geodesic distance to the substation"
  tortuosity_road:
    description: "Ratio of the routed access road length to the geodesic distance to the road"
  gamma:
    description: "Solar module temperature coefficient (1/K, negative)"
  eta_loss:
    description: "Wind availability + wake losses (fraction)"

# Sampler configuration (U-02, U-04)
sampler:
  # Method: Latin hypercube sampling (U-02)
  method: "latin_hypercube"

  # Seed for reproducibility (A-12, M-F6-02)
  # Fixed seed ensures determinism across reruns (same configuration, same samples)
  seed: 42

  # Sample size (U-04: convergence protocol)
  # Start at 500, double until Jaccard(top-k) change < 0.01 for all countries/techs
  # Once converged, record the adopted size here (along with the convergence analysis
  # in the F6 phase record)
  initial_size: 500
  # Ceiling of the doubling (D-F6-004): the phase sample_size_convergence stops at the last size not above it and reports no convergence
  # if the criterion was not met. The value is the author's; null makes the phase refuse to run.
  max_size_for_convergence: null
  # U-04: the sample size is adopted when 1 - Jaccard of the top-k sets of two consecutive sizes is below this value
  convergence_tolerance: 0.01

# Land eligibility of Stage F3 (Group 6, COMMAND 97; docs/thesis/methods/group6_land_eligibility.tex, theory: docs/thesis/theory/ch2_land_eligibility_constraints.tex).
# Every scenario-dependent parameter has one explicit value per land scenario (restrictive / central / permissive) with its unit, source, tier and status;
# null means "no limit" in that scenario. A legal rule is the same in the three scenarios (the Brazilian riparian classes); where the law leaves no choice
# the scenarios vary the uncertain estimate the rule is applied to (the width exponent). `status: verify` marks what the .tex files mark `% verify`.
# Sources are the keys of tex/references.bib. The residual land-use factor of Group 1 (parameters.json `luf`) repeats none of these criteria.
land_availability:
  # OQ-060 (Douglas, 2026-10-18, COMMAND 51): a cell whose elevation is missing (no eligible pixel has a DEM value) is not a candidate, for every
  # technology and every land scenario; it is counted under the reason `missing_elevation`. The altitude limit of a technology (`elevation_max_m`)
  # is then evaluated only on cells that have an elevation (reason `elevation_max`). Eligible area is not changed; the rule acts on the candidate set.
  missing_elevation: ineligible
  # WorldCover classes of permanent water: the river corridor is the union with them, not the sum (decision C1 of docs/_audit/group6_audit_97.md, Douglas 2026-11-05)
  water_classes: [80]
  riparian:
    # W = a Q^b (eq:g6_width): channel width of a HydroRIVERS reach from its long-term mean discharge DIS_AV_CMS (Andreadis et al. 2013, fitted to bankfull
    # discharge, so W is a width proxy that tends to underestimate the legal channel width: a limitation, LIMITATIONS). The corridor of a reach has half-width W/2 + B_c(W).
    # The central width is a Q^0.50; the permissive and restrictive widths are the minimum and the maximum of a Q^0.48 and a Q^0.52 on each reach (Q^b falls as b
    # grows below 1 m3/s), which nests the corridors of the three scenarios on every reach (Douglas, 2026-11-05).
    width_coefficient: 7.2
    discharge_column: DIS_AV_CMS
    width_exponent:
      restrictive: 0.52
      central: 0.50
      permissive: 0.48
      unit: "1"
      source: "andreadis2013 (W = 7.2 Q^0.50, exponent uncertainty about +/-0.02); HydroRIVERS: lehner2013"
      tier: 2
      status: sourced
      note: "The published uncertainty of the exponent. The scenarios use the extremes of the width over the range 0.48 to 0.52 (permissive: the narrower, restrictive: the wider of the two), not the extreme exponents, so the corridors are nested for Q below and above 1 m3/s."
    source: "lehner2013 (HydroRIVERS: reaches with a catchment of at least 10 km2 or a mean discharge of at least 0.1 m3/s); andreadis2013"
    note: "The class limits of 10, 50, 200 and 600 m of the Brazilian rule are mean discharges of about 1.9, 48, 770 and 6,900 m3/s at b = 0.50. The buffer B_c is measured from the channel edge. HydroRIVERS does not distinguish ephemeral channels or navigable waters."
    countries:
      BRA:
        # Forest Code (Lei 12.651/2012, art. 4, I): five width classes of natural perennial and intermittent watercourses; the same in the three scenarios
        restrictive: &bra_classes
          - {below_width_m: 10.0, buffer_m: 30.0}
          - {below_width_m: 50.0, buffer_m: 50.0}
          - {below_width_m: 200.0, buffer_m: 100.0}
          - {below_width_m: 600.0, buffer_m: 200.0}
          - {below_width_m: null, buffer_m: 500.0}
        central: *bra_classes
        permissive: *bra_classes
        source: "brasil2012forestcode, art. 4, I"
        tier: 1
        status: sourced
        note: "The law excludes ephemeral channels, which HydroRIVERS does not distinguish: every reach is treated as perennial or intermittent."
      PRT:
        # Lei 54/2005: margin of the public water domain 10 m (non-navigable), 30 m (navigable or floatable waters, public reservoirs), 50 m (maritime and port
        # jurisdiction, not represented: the tidal limit is not in the river network). Navigability is not in global hydrography: the central scenario uses the
        # estimated width as a proxy (10 m below W = 10 m, 30 m from there on; Tier 3), the permissive scenario 10 m and the restrictive 30 m everywhere.
        restrictive:
          - {below_width_m: null, buffer_m: 30.0}
        central:
          - {below_width_m: 10.0, buffer_m: 10.0}
          - {below_width_m: null, buffer_m: 30.0}
        permissive:
          - {below_width_m: null, buffer_m: 10.0}
        source: "portugal2005lei54, art. 11; the central width proxy for navigability is author judgment"
        tier: 3
        status: sourced
        note: "Restrictive and permissive are the legal values (Tier 1); the central proxy of navigability is Tier 3. The 50 m margin of estuaries is not represented."
      IND:
        # No national statutory riparian buffer was identified: author judgment within the range used in siting studies
        restrictive:
          - {below_width_m: null, buffer_m: 200.0}
        central:
          - {below_width_m: null, buffer_m: 100.0}
        permissive:
          - {below_width_m: null, buffer_m: 30.0}
        source: null
        tier: 3
        status: author_judgment
        note: "No national statutory riparian buffer was identified; 30 / 100 / 200 m are author judgment (Tier 3), L-0xx of docs/LIMITATIONS.md."
      ZZZ:
        # synthetic country (A-06, V-08): test values with one class boundary at W = 60 m so that the ZZZ rivers (DIS_AV_CMS = 50, W = 50.9 m at b = 0.50) sit near it
        restrictive:
          - {below_width_m: 60.0, buffer_m: 1000.0}
          - {below_width_m: null, buffer_m: 2000.0}
        central:
          - {below_width_m: 60.0, buffer_m: 500.0}
          - {below_width_m: null, buffer_m: 1000.0}
        permissive:
          - {below_width_m: 60.0, buffer_m: 250.0}
          - {below_width_m: null, buffer_m: 500.0}
        source: null
        tier: 3
        status: author_judgment
        synthetic: true
        note: "Test values of the synthetic country; never a result."
  settlements:
    # GHS-SMOD R2023A, epoch 2020, 1 km, Mollweide (Degree of Urbanisation applied to the GHSL population and building-footprint surface grids). Class 30 urban centre, 23 dense urban cluster,
    # 22 semi-dense urban cluster, 21 suburban or peri-urban, 13 rural cluster (village), 12 low density rural, 11 very low density rural, 10 water.
    # A settlement is every cell of class 13 or above; the dispersed rural classes 11 and 12 are not excluded. The mask is the same in the three scenarios.
    min_class: 13
    source: "schiavina2023smod; data: GeoFREA_data/external/ghsl/GHS_SMOD_E2020_GLOBE_R2023A_54009_1000_V2_0.zip (SHA-256 in docs/phases/F2a_grid_alignment.md)"
    note: "Status verify: the DOI of the data set is marked % verify in tex/references.bib. 1 km resolution: small villages are represented coarsely."
  sensitivities:
    # The former density threshold, kept as a named sensitivity (defined, not run). In a run that sets it, the density rule replaces the settlement mask.
    population_density_200:
      pop_density_max_per_km2: 200.0
      run: false
      unit: persons/km2
      source: "project value of the former E6 (DECISIONS 2026-09-10); CEEW (mallya2024ceew) cites 250 persons/km2 second-hand via SPRF (2025), OQ open"
      tier: 3
      status: verify
      note: "Replaced by the settlement model in the three scenarios (Group 6). A density threshold removes very different shares of land in countries with different rural settlement patterns, most of all in India."
  technologies:
    solar:
      slope_max_pct:
        restrictive: 3.0
        central: 5.0
        permissive: 10.0
        unit: "%"
        source: "lopez2012 (NREL, 3 %: conservative limit; 20 % for wind), tao2024 (design slopes of about 3 to 7 %), blm2024westernsolar (excludes land steeper than 10 %)"
        tier: 2
        status: sourced
        note: "Computed from the 30 m GLO-30 samples: the share of the pixel steeper than the threshold (percent = tangent; 3 / 5 / 10 % = 1.72 / 2.86 / 5.71 deg). The 1-degree bins of F2a give an error of at most 0.33 % in the slope-eligible area (docs/_audit/group6_audit_97.md)."
      settlement_setback_m:
        restrictive: 1000.0
        central: 500.0
        permissive: 0.0
        unit: m
        source: "uyan2013 and watson2015 (about 500 m for both technologies); the restrictive 1,000 m is author judgment"
        tier: 3
        status: sourced
        note: "Setbacks of studies in other countries: none of the three countries sets a national setback for these technologies in the sources reviewed. Measured from the edge of the settlement pixels."
      min_area:
        cluster_km2:
          restrictive: project_area
          central: 1.0
          permissive: null
          unit: km2
          source: "lopez2012 (NREL removed contiguous eligible areas below 1 km2 for rural utility PV); restrictive: P_ref / PD_PV of parameters.json (Groups 3 and 1)"
          tier: 3
          status: sourced
          note: "project_area is the area of the 100 MW reference project of Group 3, P_ref / PD of the restrictive PV density. The cluster is 8-connected 0.01 degree pixels with an eligible fraction above 0; its eligible area is the sum of fraction x geodesic pixel area."
        pixel_fraction:
          restrictive: null
          central: null
          permissive: null
          unit: fraction
          source: null
          tier: 3
          status: not_applicable
          note: "No pixel floor for PV."
      excluded_classes:
        nominal: cropland_excluded
        levels:
          cropland_excluded: [10, 40, 50, 70, 80, 90, 95]
          cropland_allowed: [10, 50, 70, 80, 90, 95]
        source: "ESMAP Global PV Potential by Country (forests, cropland, water, urban); ENSPRESO 2 key (wetlands, snow); cropland excluded by Douglas, 2026-10-07 (conservative: land in use)"
        status: sourced
      iucn_categories:
        nominal: all_designated
        levels:
          ia_ib_ii: [ia, ib, ii]
          ia_ib: [ia, ib]
          all_assigned: [ia, ib, ii, iii, iv, v, vi]
          all_designated: ['*']  # every WDPA polygon, also those with no IUCN category (Not Reported: most of Natura 2000)
        source: "central = every designation, Douglas 2026-10-07 (conservative: do not understate protection; most PRT sites are Not Reported). ESMAP excludes every IUCN status; ENSPRESO 2 excludes Natura 2000 plus 500 m; Franke et al. 2024 (Enertile) via Brooks et al., arXiv:2511.23339 use Ia, Ib, II only"
        status: sourced
        note: "The ia_ib level has no source (candidate)."
    wind:
      slope_max_pct:
        restrictive: 10.0
        central: 20.0
        permissive: 30.0
        unit: "%"
        source: "vanhaaren2011 (10 % from crane constraints), lopez2012 (20 %), epg2024renewland (wind slope exclusions of about 7 to 30 %); ENSPRESO 2 uses 18 % (elsner2023onshore)"
        tier: 2
        status: sourced
        note: "10 / 20 / 30 % = 5.71 / 11.31 / 16.70 deg, from the 30 m GLO-30 samples as for PV."
      settlement_setback_m:
        restrictive: 1000.0
        central: 800.0
        permissive: 500.0
        unit: m
        source: "rediske2021 (about 1 km typical), drechsler2017 and lehmann2021 (800 m for noise limits of a 3 MW reference turbine), watson2015 (about 500 m)"
        tier: 2
        status: sourced
        note: "Planning choices of studies in other countries, not universal legal limits. Measured from the edge of the settlement pixels."
      min_area:
        cluster_km2:
          restrictive: project_area
          central: null
          permissive: null
          unit: km2
          source: "restrictive: P_ref / PD_wind of parameters.json (Groups 3 and 1)"
          tier: 3
          status: sourced
          note: "project_area is the area of the 100 MW reference project, P_ref / PD of the restrictive wind density."
        pixel_fraction:
          restrictive: 0.10
          central: 0.10
          permissive: null
          unit: fraction
          source: "elsner2023onshore (ENSPRESO 2 allocates wind to a 1 km2 cell only when at least 10 % of it, 10 ha, is suitable: one 3 MW turbine)"
          tier: 2
          status: sourced
          note: "A pixel with a smaller eligible fraction is dropped before the clusters are formed."
      # OQ-058 (Douglas, 2026-10-16, COMMAND 46; Group 6 scenario values, COMMAND 97): wind cells whose elevation is above the limit of the scenario are not
      # candidates in it (F3 excludes them, so F4 to F8 never see them). Cell elevation is the eligible-area-weighted mean of the aligned 30 m DEM.
      # The limit stands for access, construction and cold-climate constraints: air density already enters the wind capacity factor.
      elevation_max_m:
        restrictive: 2000.0
        central: 3000.0
        permissive: null
        unit: m
        source: "epg2024renewland (siting studies commonly exclude land above 1,800 to 2,000 m for wind; ENSPRESO applies no elevation cutoff); the central 3,000 m has no source"
        tier: 3
        status: verify
        note: "Central Tier 3 (L-025). Status verify: the English edition and year of epg2024renewland are marked % verify in tex/references.bib."
      excluded_classes:
        nominal: forest_excluded
        levels:
          forest_excluded: [10, 50, 70, 80, 90, 95]
          forest_allowed: [50, 70, 80, 90, 95]
          forest_and_cropland_excluded: [10, 40, 50, 70, 80, 90, 95]
        source: "ENSPRESO 2 land-cover key (forest, wetlands, water excluded; arable land and pasture allowed); McKenna et al. 2022 (forest from full exclusion to partial allowance)"
        status: sourced
      iucn_categories:
        nominal: all_designated
        levels:
          ia_ib_ii: [ia, ib, ii]
          ia_ib: [ia, ib]
          all_assigned: [ia, ib, ii, iii, iv, v, vi]
          all_designated: ['*']  # every WDPA polygon, also those with no IUCN category (Not Reported: most of Natura 2000)
        source: "same as solar"
        status: sourced
        note: "The ia_ib level has no source (candidate)."

# Output thresholds. The satisficing LCOE threshold `tau` (M-F7-04, OQ-008), the minimum capacity factor `CF_min` (M-F7-01) and the top-k share
# `p_k` (M-F7-05, OQ-021) are per country and technology, in parameters.json (`tau_lcoe_usd_per_mwh`, `cf_min`, `top_k_percent`); the capacity
# target (OQ-010) has one source, `national_targets` below.
thresholds:
  # Regret quantile (M-F7-02)
  # q_ref for the "optimal" LCOE definition (default 0 = minimum)
  # OQ-020: Decision on q_ref
  regret_quantile: 0  # Set by OQ-020 (0 = minimum)

# F7 hypothesis decision rules (METHODOLOGY M-F7-07, OQ-050). One list of rules per hypothesis; a rule compares one statistic F7 writes
# (`hypothesis_<ISO3>_<tech>.parquet`, column `statistic`) with a threshold: `comparison` is ge, gt, le or lt and the rule is met when
# `value <comparison> threshold`. H1 to H5 are pre-registered, each in its own form; a hypothesis whose rule is null gets `verdict = null` and a
# warning from F7, which never invents a rule.
hypothesis_rules:
  # H1 (docs/thesis/hypotheses/H1_climate_rank_robustness.tex): H1a holds when C_k >= alpha, H1b when V_k >= beta, with the tolerance
  # m = tolerance_multiple_of_k * k beyond the top-k boundary; rbo_p is the persistence of the descriptive rank-biased overlap.
  H1:
    alpha: 0.60
    beta: 0.20
    tolerance_multiple_of_k: 1.0
    rbo_p: "1 - 1/k"
    source: "OQ-050 (H1), pre-registered 2026-10-13"
  # H2 (docs/thesis/hypotheses/H2_spatial_aggregation_bias.tex): the cell selection and the Admin1 selection take the same capacity T (that of
  # the robust top-k set); O is the share of T both select. H2 is not testable when T / Q_max >= gamma, supported when O < gamma, not
  # supported when O >= gamma.
  H2:
    gamma: 0.30
    partition: admin1
    region_statistic: capacity_weighted_mean
    target: top_k_capacity
    source: "OQ-050 (H2), pre-registered 2026-10-13"
  # H3 (docs/thesis/hypotheses/H3_robust_versus_nominal.tex): D is the share of the capacity of the robust top-k set (by MR) that lies in
  # cells whose nominal rank (by LCOE at f0) exceeds k + m, both rankings over the ranked set I, m = tolerance_multiple_of_k * k. H3 is not
  # testable when D_ref = 1 - (k + m) / |I| is below delta, supported when D >= delta, not supported when D < delta.
  H3:
    delta: 0.20
    tolerance_multiple_of_k: 1.0
    domain: I
    weight: capacity
    source: "OQ-050 (H3), pre-registered 2026-10-13"
  # H4 (docs/thesis/hypotheses/H4_axis_dominance.tex): D_clim and D_tec are the H3 statistic on the shortlists of the climate-only and the
  # techno-only scores; rho = D_clim / (D_clim + D_tec) gives the profile of a country and technology (Climate-Dominated above `upper`,
  # Techno-Economic-Dominated below `lower`, Mixed between, inclusive). The verdict is per technology across countries: supported when one country
  # is Climate-Dominated and another Techno-Economic-Dominated (strict_per_technology).
  H4:
    lower: 0.40
    upper: 0.60
    rule: strict_per_technology
    tolerance_multiple_of_k: 1.0
    source: "OQ-050 (H4), pre-registered 2026-10-13"
  # H5 (docs/thesis/hypotheses/H5_climate_threat_to_targets.tex): H5a (resource) holds when R_loss = Delta E / H_0 reaches `lambda`, H5b
  # (exposure) when R_exp = E_exp / H_0 reaches it, with H_0 the margin of the baseline economic potential over the national target. The
  # economic domain is fixed at f0 (LCOE <= tau, OQ-008), the members are those of the core window and the exposure is the maximum over the members
  # that carry the hazard channel. `sensitivity_lambda` is the second threshold reported beside the primary one.
  H5:
    lambda: 0.20
    sensitivity_lambda: 0.10
    domain: fixed_at_f0
    members: core_window
    hazard_members: hazard_channel
    source: "OQ-050 (H5), pre-registered 2026-10-14"

# National expansion targets of H5 (M-F7-07, OQ-010): per country and technology the value, its unit (GW or TWh/year), the source and the horizon
# year. The author sets them from the official planning documents, horizon-matched to the core window; a value needs its unit,
# source and horizon. `alternatives` lists other official targets or horizons for the sensitivity of H5. This is the only definition of the
# target: the capacity target of the top-k sensitivity is derived from it when the unit is GW and is not testable when it is TWh/year.
national_targets:
  BRA:
    solar: {value: null, unit: null, source: null, horizon: null, alternatives: []}
    wind: {value: null, unit: null, source: null, horizon: null, alternatives: []}
  PRT:
    solar: {value: null, unit: null, source: null, horizon: null, alternatives: []}
    wind: {value: null, unit: null, source: null, horizon: null, alternatives: []}
  IND:
    solar: {value: null, unit: null, source: null, horizon: null, alternatives: []}
    wind: {value: null, unit: null, source: null, horizon: null, alternatives: []}

# Hazard exposure thresholds (T-R10, H5; OQ-051): the value of the absolute indicator above which a cell counts as exposed.
# Source and tier are the author's; the wording is "exposed". The author sets each threshold (OQ-051). The indicators are those of hazard_context.
# H5b uses the channels that have a threshold; a channel left null is excluded and declared in the output, and the set is fixed when OQ-051 closes.
hazard_thresholds:
  tx35_days: {threshold: null, unit: days, source: null, tier: null}
  tx40_days: {threshold: null, unit: days, source: null, tier: null}
  rx5day_mm: {threshold: null, unit: mm, source: null, tier: null}
  wet_p95_exceed_freq: {threshold: null, unit: fraction, source: null, tier: null}
  gust_mean_annual_max_ms: {threshold: null, unit: m/s, source: null, tier: null}

# Definitions of the hazard indicators of hazard_context (M-F4-05), named as the columns of hazard_context.parquet: the heat-day thresholds, the
# wet-day threshold and the percentile of the wet-day indicator. They are definitions of the indicator, not exposure thresholds (those are
# `hazard_thresholds`, OQ-051): tx35_days counts the days per year with daily maximum temperature at or above 35 C, tx40_days at or above 40 C,
# wet_p95_exceed_freq the share of wet days (precipitation at or above `wet_day_mm`) above the cell's own 95th percentile of the reference period.
hazard_indicators:
  tx35_days: {threshold_c: 35.0, unit: days, source: "CRAEI config/params.yaml heat_tx35_threshold_c (IPCC AR6 Atlas)", tier: 1}
  tx40_days: {threshold_c: 40.0, unit: days, source: "CRAEI config/params.yaml heat_tx40_threshold_c (IPCC AR6 Atlas)", tier: 1}
  wet_p95_exceed_freq: {wet_day_mm: 1.0, percentile: 95.0, unit: fraction, source: "CRAEI hazards/precip.py WET_DAY_THRESHOLD_MM and wet_day_p95", tier: 2}

# PRIM scenario discovery (M-F7-08; docs/thesis/methods/synthesis_and_scenario_discovery.tex). The unit is the future of the core window; a
# future is a case of interest when the capacity share V_f of the nominal shortlist whose rank by relative regret exceeds k + m is at least
# `outcome_threshold` (theta); m = tolerance_multiple_of_k * k. Peeling and pasting fraction and minimum support follow Bryant and Lempert (2010).
# The box is the one of highest density among those with coverage of at least `min_coverage` and at most `max_restricted_descriptors` restricted
# descriptors. The bootstrap resamples the futures `bootstrap_replicates` times (seed derived from the sampler seed) and reports the percentiles
# `percentile_low` to `percentile_high`. `sensitivity` lists the other values of theta, of the minimum coverage and of the minimum support.
prim:
  outcome_threshold: 0.20
  tolerance_multiple_of_k: 1.0
  peel_alpha: 0.05
  mass_min: 0.05
  max_restricted_descriptors: 3
  box_choice: max_density_given_min_coverage
  min_coverage: 0.50
  bootstrap_replicates: 200
  percentile_low: 5
  percentile_high: 95
  sensitivity:
    outcome_threshold: [0.10, 0.30]
    min_coverage: [0.40, 0.60]
    mass_min: [0.02, 0.10]
  source: "OQ-056, pre-registered 2026-10-14"

# Cross-country synthesis (T-R8, M-F8-03). It issues no aggregate verdict: per hypothesis and technology it counts the countries by verdict class and
# labels the pattern `consistent` (every testable case has the same verdict), `context_dependent` (the testable cases differ) or `not_assessable`
# (fewer than `min_testable_cases` testable cases). The partial classes of H1 and H5 stay apart; a case without a verdict is not testable.
synthesis:
  labels:
    consistent: consistent
    context_dependent: context-dependent
    not_assessable: not assessable
  min_testable_cases: 2
  rule: all_testable_same_verdict
  partial_classes_separate: [H1, H5]
  source: "OQ-050 (T-R8), pre-registered 2026-10-14"

# Settings of the thesis figures that are choices of presentation (M-F8-02, D-F8-018 to D-F8-019). `gcm_agreement` is the marking of T-R3: a cell is
# marked when at least `min_share` of the GCMs of an SSP agree on the sign of the change of the capacity factor (two thirds, the convention of the
# IPCC AR6 WGI Atlas; Tier 3, verify). `dag_axes` lists the phases that run along the member axis and along the sample axis, drawn on the T-M1 graph.
thesis_figures:
  gcm_agreement:
    rule: sign_of_change
    min_share: "2/3"
    source: "D2 of docs/_audit/2026-10_F8_design.md; IPCC AR6 WGI Atlas (verify)"
  dag_axes:
    member: [climate_forcing, technical_potential, lcoe_modeling, robustness_analysis]
    sample: [lcoe_modeling, robustness_analysis]

# F7b external validation settings (M-F7b-01 to M-F7b-03, D-F7b-004). The deciles are the lowest eligible-area deciles of the nominal
# LCOE at m0 whose enrichment ratio is reported. The vintage and location-accuracy filters are sensitivity rows: null reports only the
# row for all operating units; a value needs its reason.
external_validation:
  enrichment_lowest_deciles: [1, 2, 3]
  vintage_min_start_year: null
  vintage_reason: null
  excluded_location_accuracy: null

# Maps of the technical potential (potential_maps, D-F5-029, COMMAND 60). One map per file, per country and technology, in the common style of
# viz/mapstyle.py. Main maps: capacity density (MW per km2) and energy density (GWh per km2 per year) per cell of the central scenario, continuous
# (robust colour limits, no interpolation: a pixel is a cell of 0.05 degree), and per state (admin1) in the three land scenarios the same densities as a
# choropleth (the state total over its land area) with a circle over each state whose area is proportional to its total (GW, TWh per year).
# The classes of the state maps are computed from the data (no fixed limits): Fisher-Jenks natural breaks of the state densities of the central scenario,
# applied to the three scenarios so that the colours are comparable between them; the last class is open ("> limit") and holds the larger values of
# the restrictive and permissive scenarios (D-F5-030). The limits are rounded to `significant_figures` (the last limit of a closed class upwards); a
# class that collapses with its neighbour after the rounding is dropped and recorded in potential_breaks_<tech>.json. The sum of the cells and of the
# states must equal the F5 national total within 0.1% or the phase fails.
# per_cell: true also draws the classed maps of MW and GWh per cell (the maps of the earlier version), with the classes of per_cell_classes.
absolute_maps:
  per_cell: false
  per_cell_classes:
    method: quantile
    classes: 7
  per_state:
    method: fisher_jenks
    classes: 6
    basis: central
    open_last_class: true
  significant_figures: 2
  palette: viridis
  # Display only (COMMAND 67b, D-core-047): a continuous map (capacity factor, densities) whose analysis cell covers more than 4 pixels of the image
  # is drawn from the 0.01 degree display layer when there is one, and, if a cell is still a block, interpolated with its mask; the subtitle says
  # "display smoothing" and the source resolution. Classes, categories and per-state maps are never smoothed. auto | off.
  display_smoothing: auto

