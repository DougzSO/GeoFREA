# GeoFREA country configuration — METHODOLOGY A-05
#
# Maps ISO-3166-alpha-3 country codes to data-source-specific regional
# identifiers and directory names. This replaces hardcoded country mappings
# scattered across src/geofrea/data_acquisition/local_layers.py and
# src/geofrea/data_acquisition/fetchers/hydrosheds.py.
#
# Each country entry has sub-keys for different data sources:
#   - hydrosheds_region: HydroSHEDS continent tile code (HydroRIVERS only)
#   - elevation_dir: Subdirectory name in GEOFREA_SHARED_RAW_DIR/elevation/
#   - land_cover_dir: Subdirectory name in GEOFREA_SHARED_RAW_DIR/land_cover/
#   - grip4_region_dir: Subdirectory in GEOFREA_SHARED_RAW_DIR/infrastructure/roads/
#   - grip4_region_file: GRIP4 shapefile name within grip4_region_dir
#   - gadm_dir: Subdirectory name in GEOFREA_SHARED_RAW_DIR/countries_borders/
#     holding the pre-placed GADM 4.1 shapefile set (gadm41_<ISO3>_0.shp
#     through _N.shp) — METHODOLOGY M-F1-07, local database checked
#     before the network.
#   - gadm_level0_sha256: Recorded sha256 of gadm_dir's level-0 (country
#     boundary) shapefile. A local hit is trusted only when this matches
#     (verified at fetch time); a mismatch fails loud
#     (GadmChecksumMismatchError, METHODOLOGY A-09) rather than silently
#     re-downloading. A null gadm_dir or gadm_level0_sha256 means the
#     local database is skipped for that country — GADM falls through to
#     its existing network-download path instead.
#
# A null value means the mapping has not been determined yet or the country
# lacks that data source entirely. Code reading from config/ must raise a
# named error if a null mapping is requested, never silently proceed.
#
# OQ-012: India mappings — blocked on resolution of which GRIP4 region
# numbering scheme (regions_lookup.json vs. shapefiles' gp_gripreg) is
# correct for India and other extended-scope countries.

BRA:
  hydrosheds_region: "sa"  # South America (HydroRIVERS)
  elevation_dir: "Brazil"
  land_cover_dir: "Brazil"
  grip4_region_dir: "Region_2_Central_South_America"
  grip4_region_file: "GRIP4_region2.shp"
  gadm_dir: "Brazil"
  gadm_level0_sha256: "b9fab45e4c63b017cdfd51d107c09d992c39139f0c3d93ad6ccc86b8ab925f49"
  # Fallback list — resolve_land_cover_tiles() now also runs a real
  # polygon-overlap check (filename-derived tile bbox vs GADM geometry)
  # as its primary defense, which independently catches every tile
  # below except N03W051 (0.0 deg^2 overlap, confirmed TILE-SCAN
  # 2026-09-22: 6 files corrupted/0-byte in the S36 row extending into
  # Argentina/Chile/ocean, 36 files valid-but-out-of-territory from the
  # original bbox-based fetch). This list stays as a belt-and-suspenders
  # fallback for any case the geometry filter can't cover (e.g. a
  # non-standard filename it can't parse a bbox from), and for
  # N03W051's manual judgment-call exclusion (see entry below).
  excluded_land_cover_tiles:
    - "ESA_WorldCover_10m_2020_v100_S36W057_Map.tif"
    # N03W051: ~0.33 km^2 (2.7e-5 deg^2) real overlap with BRA — a
    # genuine sliver, not zero, so the geometry filter's threshold
    # deliberately does not auto-exclude it (see local_layers.py's
    # _MIN_OVERLAP_DEG2). Manually accepted as a judgment call by
    # Douglas, 2026-09-22 — negligible contribution, not worth keeping
    # in the mosaic input for its processing cost.
