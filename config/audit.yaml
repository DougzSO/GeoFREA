# audit.yaml — data_quality_audit (F1b) diagnostic-gate configuration.
#
# Scope: M-F1b-01's "expected resolutions and sanity ranges are
# configuration, not code". Every value here either carries a `source`
# (a primary reference: literature, official product documentation, or
# the native metadata of a file actually read from disk, with the read
# date) or is `null` with an OQ ID in a comment — never a plausible
# guess. See docs/phases/F1b_data_quality_audit.md action F7-2 for the
# read-metadata evidence behind every sourced value below.
#
# These are diagnostic-gate defaults (M-F1b-02: audit reports, never
# blocks) — they gate this phase's own alert text, never a downstream
# calculation.

resolution_tolerance: 0.5

layers:
  land_cover:
    expected_resolution_deg: 0.00008333
    source: "native metadata (GDAL transform) of ESA_WorldCover_10m_2020_v100 tiles, one tile each for BRA (N00W051) and PRT (N30W018), both agreeing at 1/12000 deg — read 2026-09-22"

  solar:
    expected_resolution_deg: 0.00833333
    source: "native metadata (GDAL transform) of World_PVOUT_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF/PVOUT.tif — single global file shared by BRA and PRT, read 2026-09-22"
    unit: "kWh/kWp/day"
    sanity_range: [0.7, 6.8]
    # sanity_range source: the file's own STATISTICS_MINIMUM/MAXIMUM
    # GeoTIFF band tags (0.727 / 6.731), rounded outward to one decimal
    # — read 2026-09-22. unit source: the file's own XML sidecar
    # (PVOUT.tif.xml), gmd:abstract and gmd:RecordType both state
    # "PVOUT ... in kWh/kWp" — read 2026-09-22. Confirms M-F1-02
    # (kWh/kWp/day); the code's prior "kWh/m2/day" label was wrong, not
    # METHODOLOGY.

  population:
    expected_resolution_deg: 0.00083333
    source: "native metadata (GDAL transform) of WorldPop bra_pop_2020.tif, prt_pop_2020.tif and ind_pop_2020.tif, all three agreeing at 1/1200 deg — read 2026-09-24. Absent from this file until this entry; see docs/phases/F1b_data_quality_audit.md Known issues for the prior gap."
    unit: "count (people per pixel)"
    sanity_range: [0, 3692]
    # unit and sanity_range source: docs/_audit/2026-09_layer_quantities.md section 8
    # (ADJ-2, 2026-09-24) — decided by summation, not inference. Summing every valid
    # pixel inside each country's real GADM polygon reproduces the country's 2020
    # reference population within 0.4-2.9% for BRA/PRT/IND (counts signature);
    # reading the same values as density instead undershoots the reference by a
    # factor of ~117-140x (the inverse-pixel-area signature the density hypothesis
    # would need). sanity_range is the observed max across the three countries
    # (3691.75, rounded outward), not a percentile bound — a single dense-urban
    # pixel spike is a legitimate value (cross-checked at the 99.9th percentile
    # against plausible urban density in persons/km2 for all three countries), not
    # an anomaly this gate should flag.

  elevation:
    expected_resolution_deg: 0.005
    source: "native metadata (GDAL transform) of Copernicus DEM 30m files BRA_elevation.tif and PRT_elevation.tif, both agreeing at 0.005 deg — read 2026-09-22"

  # No `slope` entry (removed 2026-09-23, see docs/phases/
  # F1b_data_quality_audit.md D-F1b-003, resolving OQ-030): slope is
  # not an F1b layer at all — it does not exist until grid_alignment
  # derives it from the DEM (raster_alignment.derive_slope_from_dem(),
  # F2a). F1b never has a file to audit here, so carrying a permanently
  # null entry for it misstated the audit as having an open question
  # about slope's resolution, when the real fact is that F1b is the
  # wrong phase to own that expectation at all. See docs/phases/
  # F2a_grid_alignment.md Known issues for where it belongs instead.

  wind:
    wind-speed:
      expected_resolution_deg: 0.0025
      source: "native metadata (GDAL transform) of Global Wind Atlas BRA_wind_speed_100m.tif and PRT_wind_speed_100m.tif, both agreeing at 0.0025 deg — read 2026-09-22. Resolves the prior code/phase-record conflict (code: 0.0083 deg, unsourced; phase record: 0.0025 deg, unsourced) — see OQ history in docs/phases/F1b_data_quality_audit.md."
    combined-Weibull-A:
      expected_resolution_deg: 0.0025
      source: "native metadata of combined-Weibull-A, read 2026-09-23: GDAL transform of BRA_weibull_a_100m.tif, PRT_weibull_a_100m.tif and IND_weibull_a_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."
    combined-Weibull-k:
      expected_resolution_deg: 0.0025
      source: "native metadata of combined-Weibull-k, read 2026-09-23: GDAL transform of BRA_weibull_k_100m.tif, PRT_weibull_k_100m.tif and IND_weibull_k_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."
    air-density:
      expected_resolution_deg: 0.0025
      source: "native metadata of air-density, read 2026-09-23: GDAL transform of BRA_air_density_100m.tif, PRT_air_density_100m.tif and IND_air_density_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."

  # Resource channel only (M-F1-04): each model keeps its own native
  # grid (F3-1 action 5, no ISIMIP3b-style pre-regridding for raw CDS
  # CMIP6), so — like wind's per-product nesting above — this is keyed
  # per model, not one flat entry. Resolves OQ-028 for the resource
  # channel (task F-3, COMMAND F3-2); the hazard channel (tasmax/pr,
  # ISIMIP3b via CRAEI) is a separate acquisition (OQ-036) with its own
  # resolution, not covered here.
  cmip6:
    gfdl_esm4:
      expected_resolution_deg: 1.25
      source: "native metadata of gfdl_esm4_historical_tas_BRA.nc (M-F1-04 country crop, task F-3/COMMAND F3-2), read 2026-09-27: GDAL/rasterio-reported pixel size 1.25 deg (native grid is 180x288, lat step 1.0 deg x lon step 1.25 deg, not square — 1.25 deg is the lon-axis value inspect_raster() actually reports and compares against). Resolves OQ-028 for GFDL-ESM4's resource channel. No embedded CRS (same gap as combined-Weibull-A/k above, D-F1b-005) — GeoTIFF EPSG:4326 assumed, not yet confirmed against a reference the way Weibull was; F1b's data_quality_audit run reports this as a [MISSING] CRS finding, not silently assumed."
    miroc6:
      expected_resolution_deg: 1.40625
      source: "native metadata of miroc6_historical_tas_BRA.nc (M-F1-04 country crop, task F-3/COMMAND F3-2), read 2026-09-27: GDAL/rasterio-reported pixel size 1.40625 deg (native grid is 128x256, lat step ~1.400 deg x lon step 1.40625 deg, not square — 1.40625 deg is the lon-axis value inspect_raster() actually reports and compares against). Resolves OQ-028 for MIROC6's resource channel. No embedded CRS — same caveat as gfdl_esm4 above."

  era5_gust:
    expected_resolution_deg: 0.25
    source: "native grid of the acquired ERA5 reanalysis-era5-single-levels fg10 files (CDS, 0.25 deg regular lat/lon), read 2026-10-06 from era5_registry.json native_grid (median step, 0.25 x 0.25 for BRA, IND and PRT) and confirmed by GDAL/rasterio on the per-country annual-maximum rasters (EPSG:4326, 0.25 deg). Resolves OQ-029."

  gem_existing_plants:
    expected_resolution_deg: null  # acquired 2026-10-07 (F5-1); tabular, not a resolution layer.
    source: null

# Sanity ranges of the F2b layers that are derived, not looked up (V-04, H-6; siting_layers/sanity.py). No number is stored: each range
# follows from a named derivation, per country, so it needs no research and no judgement.
#   iso2533_envelope      air density: [rho_ISA(z_max + h), rho_ISA(z_min + h)] with z_min and z_max the lowest and highest in-country
#                         DEM elevation and h the layer height above ground (ISO 2533 troposphere; constants in core/constants.py),
#                         widened by `tolerance_rel` on each side: [(1 - t) * lower, (1 + t) * upper]
#   country_bbox_diagonal distance to the grid or to the roads: [0, diagonal of the country's bounding box]
# Weibull A and k have no derivation: a range needs a sourced reading of the Global Wind Atlas documentation (OQ-053).
# PVOUT keeps the range under `layers.solar.sanity_range` above.
derived_ranges:
  air_density:
    derivation: iso2533_envelope
    source: "ISO 2533 International Standard Atmosphere, troposphere (T0 288.15 K, p0 101325 Pa, lapse 0.0065 K/m, g 9.80665 m/s2, R 287.05287 J/kg/K)"
    tolerance_rel: 0.05
    tolerance_justification: "Quality-control engineering tolerance, not a scientific parameter. At a given pressure the density goes as 1/T, so 5% of the density corresponds to a temperature departure from the standard atmosphere of 0.05 T: about 14 K at sea level (T = 288 K), about 13 K at 2 km and about 12 K at 8 km (T = 236 K), i.e. roughly 15 K in round figures. Real climates depart from the standard atmosphere by less than that, and a unit error (a factor of 10 or 1000) or a swapped layer lies far above it."
  dist_grid_km:
    derivation: country_bbox_diagonal
    source: "geometry of the F2a aligned grid of the country (no external source)"
  dist_road_km:
    derivation: country_bbox_diagonal
    source: "geometry of the F2a aligned grid of the country (no external source)"
  weibull_a:
    open_question: "OQ-053"
  weibull_k:
    open_question: "OQ-053"

# Per-country override (AuditConfig.country_overrides, A-06/D-core-018):
# ZZZ's fixture rasters are generated at whatever resolution
# scripts/generate_zzz_fixture.py chose, not the real cross-country
# source resolutions `layers` above describes -- confirmed by reading
# the generator script itself (a fixture, not a "native metadata" read,
# since there is no external product here to read metadata from).
# Empty for every real country.
country_overrides:
  ZZZ:
    land_cover:
      expected_resolution_deg: 0.01
      source: "scripts/generate_zzz_fixture.py -- fixture raster written at the 0.01 deg analysis-grid resolution directly, not a real ESA WorldCover tile."
    elevation:
      expected_resolution_deg: 0.01
      source: "scripts/generate_zzz_fixture.py -- fixture DEM written at 0.01 deg (matches the analysis grid, unlike the real 0.005 deg Copernicus DEM) so its pixel count matches the fixture design's decision-cell math exactly."
    population:
      expected_resolution_deg: 0.01
      source: "scripts/generate_zzz_fixture.py -- fixture population raster written at 0.01 deg for the same reason as elevation above."
    solar:
      expected_resolution_deg: 0.01
      source: "scripts/generate_zzz_fixture.py -- fixture PVOUT raster written at 0.01 deg (not the real Global Solar Atlas 0.00833 deg)."
      unit: "kWh/kWp/day"
      sanity_range: [4.5, 4.5]  # uniform constant fixture value, see generate_zzz_fixture.py::gen_solar()
    wind:
      expected_resolution_deg: 0.0025
      source: "scripts/generate_zzz_fixture.py -- fixture GWA-style rasters written at the real GWA convention resolution (0.0025 deg) even though the underlying values are synthetic constants."
    weibull_a:
      expected_resolution_deg: 0.0025
      source: "scripts/generate_zzz_fixture.py -- same convention as wind above."
    weibull_k:
      expected_resolution_deg: 0.0025
      source: "scripts/generate_zzz_fixture.py -- same convention as wind above."
    air_density:
      expected_resolution_deg: 0.0025
      source: "scripts/generate_zzz_fixture.py -- same convention as wind above."
