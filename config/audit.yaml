# audit.yaml — data_quality_audit (F1b) diagnostic-gate configuration.
#
# Scope: M-F1b-01's "expected resolutions and sanity ranges are
# configuration, not code". Every value here either carries a `source`
# (a primary reference: literature, official product documentation, or
# the native metadata of a file actually read from disk, with the read
# date) or is `null` with an OQ ID in a comment — never a plausible
# guess. See docs/phases/F1b_data_quality_audit.md action F7-2 for the
# read-metadata evidence behind every sourced value below.
#
# These are diagnostic-gate defaults (M-F1b-02: audit reports, never
# blocks) — they gate this phase's own alert text, never a downstream
# calculation.

resolution_tolerance: 0.5

layers:
  land_cover:
    expected_resolution_deg: 0.00008333
    source: "native metadata (GDAL transform) of ESA_WorldCover_10m_2020_v100 tiles, one tile each for BRA (N00W051) and PRT (N30W018), both agreeing at 1/12000 deg — read 2026-09-22"

  solar:
    expected_resolution_deg: 0.00833333
    source: "native metadata (GDAL transform) of World_PVOUT_GISdata_LTAy_AvgDailyTotals_GlobalSolarAtlas-v2_GEOTIFF/PVOUT.tif — single global file shared by BRA and PRT, read 2026-09-22"
    unit: "kWh/kWp/day"
    sanity_range: [0.7, 6.8]
    # sanity_range source: the file's own STATISTICS_MINIMUM/MAXIMUM
    # GeoTIFF band tags (0.727 / 6.731), rounded outward to one decimal
    # — read 2026-09-22. unit source: the file's own XML sidecar
    # (PVOUT.tif.xml), gmd:abstract and gmd:RecordType both state
    # "PVOUT ... in kWh/kWp" — read 2026-09-22. Confirms M-F1-02
    # (kWh/kWp/day); the code's prior "kWh/m2/day" label was wrong, not
    # METHODOLOGY.

  elevation:
    expected_resolution_deg: 0.005
    source: "native metadata (GDAL transform) of Copernicus DEM 30m files BRA_elevation.tif and PRT_elevation.tif, both agreeing at 0.005 deg — read 2026-09-22"

  # No `slope` entry (removed 2026-09-23, see docs/phases/
  # F1b_data_quality_audit.md D-F1b-003, resolving OQ-030): slope is
  # not an F1b layer at all — it does not exist until grid_alignment
  # derives it from the DEM (raster_alignment.derive_slope_from_dem(),
  # F2a). F1b never has a file to audit here, so carrying a permanently
  # null entry for it misstated the audit as having an open question
  # about slope's resolution, when the real fact is that F1b is the
  # wrong phase to own that expectation at all. See docs/phases/
  # F2a_grid_alignment.md Known issues for where it belongs instead.

  wind:
    wind-speed:
      expected_resolution_deg: 0.0025
      source: "native metadata (GDAL transform) of Global Wind Atlas BRA_wind_speed_100m.tif and PRT_wind_speed_100m.tif, both agreeing at 0.0025 deg — read 2026-09-22. Resolves the prior code/phase-record conflict (code: 0.0083 deg, unsourced; phase record: 0.0025 deg, unsourced) — see OQ history in docs/phases/F1b_data_quality_audit.md."
    combined-Weibull-A:
      expected_resolution_deg: 0.0025
      source: "native metadata of combined-Weibull-A, read 2026-09-23: GDAL transform of BRA_weibull_a_100m.tif, PRT_weibull_a_100m.tif and IND_weibull_a_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."
    combined-Weibull-k:
      expected_resolution_deg: 0.0025
      source: "native metadata of combined-Weibull-k, read 2026-09-23: GDAL transform of BRA_weibull_k_100m.tif, PRT_weibull_k_100m.tif and IND_weibull_k_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."
    air-density:
      expected_resolution_deg: 0.0025
      source: "native metadata of air-density, read 2026-09-23: GDAL transform of BRA_air_density_100m.tif, PRT_air_density_100m.tif and IND_air_density_100m.tif, all three agreeing at 0.0025 deg — resolves OQ-027 for this product."

  cmip6:
    expected_resolution_deg: null  # OQ-028 — not yet acquired (task F-3).
    source: null

  era5_gust:
    expected_resolution_deg: null  # OQ-029 — not yet acquired (task F-4).
    source: null

  gem_existing_plants:
    expected_resolution_deg: null  # not yet acquired (task F-5); tabular, not a resolution layer.
    source: null
