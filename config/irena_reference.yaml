# IRENA reference values for the calibration of tau (COMMAND 159; DEC-072, DEC-075 to DEC-080).
#
# The values are those of docs/_audit/2026-11_docs_audit/11_irena_inputs.md (report 11), registered by the author on 2026-11-15, copied here without change. Percentages of the
# source are written as fractions. A value that has no number in the table is `null`; the script `scripts/calibrate_tau_irena.py` refuses only the pairs that need a `null` and lists
# the fields. Nothing here is read by a phase: it is the input of the calibration script, outside every phase fingerprint.
#
# Every entry carries `currency`, `price_year`, `edition`, `source`, `status` and `verified`. `verified: true` on every numeric value of the table of report 11: the flag reflects
# the check that the author made of the table of docs/_audit/2026-11_docs_audit/11_irena_inputs.md against the IRENA documents (COMMAND 159B, 2026-11-16; DEC-080 lists part of it).
# A value with no number (`null`) stays `verified: false`. The solar capacity factor of Portugal keeps the mark `regional_proxy` (DEC-078, L-242). The basis of the 2024 edition (DEC-087):
# the solar TIC is per kW DC (p. 92, footnote 27) and the solar CF is an AC-DC value, AC energy over DC capacity (p. 99, footnote 32); the capacity and the CF of the other
# technologies are AC-to-AC. F6 works on DC capacity (D-F6-028), the same basis as the solar values.
#
# Units: tic_usd_per_kw in USD/kW, cf as a fraction (solar: AC energy over DC capacity; wind: AC-to-AC; DEC-087), om_usd_per_kw_yr in USD/kW per year, lcoe_usd_per_mwh in USD/MWh, wacc as a real after-tax fraction.
# p5 and p95 are the 5th and 95th percentiles of the published distribution.

schema_version: 1

# country -> the IRENA region whose WACC of 2024 applies (DEC-072)
region_of: {BRA: south_america, IND: asia, PRT: europe}

# countries whose IRENA row is another row: Portugal takes the Europe row (DEC-078); the solar capacity factor of Portugal is the EU average and is a proxy (L-242)
row_of: {BRA: BRA, IND: IND, PRT: Europe}

