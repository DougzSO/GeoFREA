# Registry of the human-readable phase names (COMMAND 200).
#
# The `id` is the name the code uses (`PhaseSpec.name`, manifests, artifact folders); it never changes. The registry adds the short code
# (`code`, the F-number of METHODOLOGY 4.2, null for the support phases), the name in English, and a group (Data, Territory, Climate, Potential, Economics, Robustness, Validation, Synthesis, Platform). It is read by
# `geofrea.core.phase_registry` for the log, the plan, the docs tables and the future platform. It is NOT part of any phase's configuration
# fingerprint (`PHASE_CONFIG_SCOPE` lists file keys and this file is not one of them) and not part of the pre-registration digest.
#
# `orchestrated: false` marks an entry that is not a `PhaseSpec` of the orchestrator: `cross_country_h4` runs once after the last
# country (METHODOLOGY 4.1) and `explorer` (E1) is outside v1.0. A test checks that the orchestrated ids are exactly the PhaseSpec names.
#
# The list is in execution order.
phases:
  - {id: data_acquisition, code: F1, name_en: Data acquisition, group: Data}
  - {id: data_quality_audit, code: F1b, name_en: Data audit, group: Data}
  - {id: external_inputs, code: null, name_en: Climate inputs registry, group: Climate}
  - {id: grid_alignment, code: F2a, name_en: Grid alignment, group: Territory}
  - {id: siting_layers, code: F2b, name_en: Siting layers, group: Territory}
  - {id: land_eligibility, code: F3, name_en: Land eligibility, group: Territory}
  - {id: climate_forcing, code: F4, name_en: Climate signal, group: Climate}
  - {id: hazard_context, code: null, name_en: Hazard context, group: Climate}
  - {id: climate_maps, code: null, name_en: Climate maps, group: Climate}
  - {id: overview, code: null, name_en: Country overview, group: Territory}
  - {id: technical_potential, code: F5, name_en: Technical potential, group: Potential}
  - {id: potential_maps, code: null, name_en: Potential maps, group: Potential}
  - {id: lcoe_modeling, code: F6, name_en: Levelized cost, group: Economics}
  - {id: sample_size_convergence, code: null, name_en: Sample-size convergence, group: Economics}
  - {id: lcoe_maps, code: null, name_en: Cost maps, group: Economics}
  - {id: robustness_analysis, code: F7, name_en: Robustness and hypotheses, group: Robustness}
  - {id: robustness_maps, code: null, name_en: Robustness maps, group: Robustness}
  - {id: cross_country_h4, code: null, name_en: Cross-country comparison, group: Robustness, orchestrated: false}
  - {id: external_validation, code: F7b, name_en: External validation, group: Validation}
  - {id: results_synthesis, code: F8, name_en: Results synthesis, group: Synthesis}
  - {id: explorer, code: E1, name_en: Explorer, group: Platform, orchestrated: false}
