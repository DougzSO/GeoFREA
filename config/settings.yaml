# settings.yaml — GeoFREA
#
# Scope: operational / pipeline-control configuration only — e.g. which
# phases run in a given execution, infrastructure paths, run-mode flags.
# Mirrors the legacy geoworld_framework's phase true/false toggles
# (skip_* flags in its own settings.yaml) — here, "phases.<name>: true"
# means the phase RUNS (not "skip"), to avoid double-negative reading;
# false means it is disabled for this run.
#
# This file does NOT hold scientific/technology parameters (CAPEX, OPEX,
# capacity factors, discount rates, etc.) — those belong exclusively in
# parameters.json, validated through the Pydantic schemas in
# src/geofrea/core/ (see docs/CONVENTIONS.md, "Parameters" and
# "Parameter verification metadata").

run:
  # Empty = run every country present in parameters.json's "countries"
  # key. Non-empty = run only this subset. Deliberately NOT hardcoded
  # to PRT/BRA here: those are just what parameters.json currently has
  # data for, not a fixed pipeline limit — the pipeline itself is
  # country-generic. See config_loader.py::load_settings() for the note
  # on how this resolves once a phase runner exists.
  countries: []

  # One flag per module, matching the "nome" values in
  # docs/PROGRESS.json's "modulos"/"modulos_extra" arrays (and the
  # src/geofrea/<name>/ package layout from Fase 1). data_acquisition
  # and data_quality_audit have real phase runners, wired together
  # (main.py, see docs/DECISIONS.md 2026-08-25 - data_acquisition
  # activation) — both false here by default; the rest are still
  # "documentado_nao_construido" per PROGRESS.json, nothing to enable
  # yet.
  phases:
    data_acquisition: false
    data_quality_audit: false
    grid_alignment: false
    suitability_criteria: false
    suitability_analysis: false
    potential_analysis: false
    lcoe_modeling: false
    results_synthesis: false
    ghg_abatement: false
    sensitivity_analysis: false

# grid_alignment's target grid resolution. Added 2026-09-09 (see
# docs/DECISIONS.md same date, grid_alignment Passo 4 item 3).
geospatial:
  resolutions:
    # Fixed degrees, or the literal string "adaptive" to compute it
    # dynamically from country area (see the "adaptive" block below).
    # 0.01 (~1km) matches legacy's own actual configured value — "~1 km,
    # consistent with global climate datasets" — and is what generated
    # the frozen PRT/BRA baseline this project regression-tests against
    # (docs/architecture/baseline-manifest.md). Legacy's "adaptive" code
    # path existed but was never the value legacy's own settings.yaml
    # actually used.
    suitability: 0.01

    # Only consulted if suitability: "adaptive" above. Ported as-is from
    # legacy's fallback dict — target_pixels has no documented
    # calibration and, for large countries, has no effect in practice
    # (max_deg saturates first; e.g. BRA's unclamped ideal resolution is
    # ~0.175deg, far past max_deg). Not the default — see suitability's
    # own comment above.
    adaptive:
      target_pixels: 50000
      min_deg: 0.001
      max_deg: 0.05
