# settings.yaml — GeoFREA
#
# Scope: operational / pipeline-control configuration only — e.g. which
# phases run in a given execution, infrastructure paths, run-mode flags.
# Mirrors the legacy geoworld_framework's phase true/false toggles
# (skip_* flags in its own settings.yaml) — here, "phases.<name>: true"
# means the phase RUNS (not "skip"), to avoid double-negative reading;
# false means it is disabled for this run.
#
# This file does NOT hold scientific/technology parameters (CAPEX, OPEX,
# capacity factors, discount rates, etc.) — those belong exclusively in
# parameters.json, validated through the Pydantic schemas in
# src/geofrea/core/ (see docs/CONVENTIONS.md, "Parameters" and
# "Parameter verification metadata").

run:
  # Empty = run every country present in parameters.json's "countries"
  # key. Non-empty = run only this subset. Deliberately NOT hardcoded
  # to PRT/BRA here: those are just what parameters.json currently has
  # data for, not a fixed pipeline limit — the pipeline itself is
  # country-generic. See config_loader.py::load_settings() for the note
  # on how this resolves once a phase runner exists.
  countries: []

  # Phases to execute (METHODOLOGY A-03). Non-empty, validated at run
  # time against the phases actually registered in main.py. The
  # orchestrator resolves everything these transitively require from
  # the requires/produces DAG (docs/phases/core.md D-core-001) — this
  # no longer needs to list upstream phases just to unblock a
  # downstream one, unlike the old per-phase boolean toggle map.
  # Phases wired in main.py, in pipeline order (the orchestrator derives the real order from the
  # requires/produces graph): F1 data_acquisition, F1b data_quality_audit, F2a grid_alignment,
  # F2b siting_layers (physical-unit layers), F4 climate_forcing (change factors, members.yaml),
  # F4 hazard_context, F4 climate_maps (diagnostic maps), F3 land_eligibility, overview, F5 technical_potential and
  # potential_maps. F5 is registered but not listed below: it fails loudly (MissingParameterError) while the real
  # countries lack LUF, power density, gamma, eta_loss, hub height and power curves (OQ-004, OQ-005, OQ-023); name it with
  # `python main.py <ISO3> --phases technical_potential,potential_maps` once those values are entered. F6-F8 are not built yet.
  # The legacy `suitability_criteria` phase was retired (V16).
  target_phases:
    - data_acquisition
    - data_quality_audit
    - grid_alignment
    - siting_layers
    - land_eligibility
    - external_inputs
    - climate_forcing
    - hazard_context
    - climate_maps
    - overview

  # Technologies to run (METHODOLOGY A-04). Non-empty, required,
  # validated against config/technologies.yaml keys at config load.
  # F5-F7 code contains no technology names (per A-04 requirement).
  technologies:
    - solar
    - wind

  # Phase names to re-execute even if the manifest already records
  # success — exactly these phases, never their dependents (R-1,
  # replacing force_rerun's cascade). Each name must be in the needed
  # closure of target_phases. Empty list (default) = normal
  # resume-from-manifest behavior. A phase downstream of a rerun is
  # marked stale_upstream in the manifest and recomputed automatically
  # the next time a run needs it, without being named here.
  rerun_phases: []

# grid_alignment's target grid resolution. Added 2026-09-09 (see
# docs/DECISIONS.md same date, grid_alignment Passo 4 item 3).
geospatial:
  # Threshold of the `distance_capped` QC flag raster beside the distance-to-grid/roads/rivers
  # rasters (M-F2a-03, OQ-040). It NEVER truncates a distance: rasters store the real geodesic
  # distance and the connection cost (M-F6-01) bills it. 100 km is provisional, no source
  # (LIMITATIONS L-019); it only decides what the flag marks for quality control.
  distance_cap_km: 100.0

  resolutions:
    # Fixed analysis-grid resolution, degrees (M-F2a-01). 0.01 (~1 km) is the value that generated the
    # frozen PRT/BRA baseline (docs/architecture/baseline-manifest.md). The grid is snapped so 0.05 degree
    # cells (S-06) nest exactly 5 x 5. The legacy "adaptive" mode was removed in G-3 (2026-10-06).
    suitability: 0.01

# Which diagnostic figures a phase draws (METHODOLOGY A-08): all | summary | none. Rasters and tables are artifacts and are
# always written; only PNG maps follow this setting. Honoured by climate_maps, overview (with its per-layer maps) and
# potential_maps:
#   all      every map: the member-level climate maps, the aligned-layer, hazard and eligibility overview figures, one map per
#            exclusion and cost layer, the potential density and capacity-factor maps
#   summary  no member-level climate maps; the overview figures and the eligible share per technology; the potential density map
#   none     no PNG at all (the overview table is still written)
figures: all
