# GeoFREA technology registry — METHODOLOGY A-04
#
# Declares per-technology configuration: resource layers, capacity-factor
# model, exclusion set, cost structure, and uncertain-parameter keys.
# F5-F7 code contains no technology names (S-02 and A-04 requirement).
#
# This is a skeleton with keys named in METHODOLOGY Section 9 and U-01 to U-06.
# Values that depend on open questions are null with the OQ ID in a comment.

solar:
  # Resource layers for this technology (M-F2b-03)
  resource_layers:
    - pvout_kwh_kwp_day  # PVOUT (kWh/kWp/day), Global Solar Atlas; same name as the F3 candidate column

  # Capacity-factor model selection (M-F5-02 for solar)
  # "pvout_with_temperature": Uses temperature-corrected PVOUT
  # (see M-F5-02: CF0 = pvout_kwh_kwp_day / 24; CF_m = CF0 * delta_rsds * (1 + gamma * dT))
  cf_model: "pvout_with_temperature"

  # Exclusion set (M-F2b-01, applied in F3)
  # Currently a subset of M-F2b-01's E1-E6; exact enum pending F3 design
  exclusions:
    - protected  # E1: WDPA protected areas
    - water      # E2: Lakes
    - riparian   # E3: Distance to rivers below threshold
    - slope      # E4: Slope above threshold
    - land_cover # E5: Excluded land-cover classes
    - population # E6: Population density above threshold

  # Cost structure (M-F6-01)
  # Which cost-driver layers are included in CAPEX
  cost_drivers:
    - grid_connection   # Distance to transmission grid (km)
    - site_access       # Distance to roads (km)

  # Parameters F5 needs (M-F5-01, M-F5-02; D-F5-011). Keys of config/parameters.json
  # countries.<ISO3>.technologies.solar; a production run refuses a null value.
  required_parameters:
    - luf                       # M-F5-01 (OQ-004)
    - power_density_mw_per_km2  # M-F5-01 (OQ-004)
    - gamma                     # M-F5-02 (OQ-023)

  # Uncertain parameters (U-03, U-04)
  # Keys must exist in config/parameters.json countries.<ISO3>.technologies.solar
  # Every key here must have a non-null range in experiments.yaml.uncertain_parameters
  uncertain_parameters:
    - capex_usd_per_kw
    - opex_fixed_frac
    - discount_rate
    - lifetime_years
    - degradation_rate
    - grid_cost_usd_per_mw_km
    - substation_cost_usd_per_mw
    - road_cost_usd_per_km
    - gamma  # Temperature coefficient (1/K, negative)

wind:
  # Resource layers for this technology
  # Weibull parameters at three hub heights (M-F2b-03, M-F5-03)
  # Names are the F3 candidate columns (<name>_<height>m); A is the Weibull scale (m/s), k the shape
  resource_layers:
    - weibull_a_100m    # Weibull scale A at 100 m (m/s)
    - weibull_k_100m    # Weibull shape k at 100 m
    - air_density_100m  # Air density at 100 m (kg/m3)
    - weibull_a_150m
    - weibull_k_150m
    - air_density_150m
    - weibull_a_200m
    - weibull_k_200m
    - air_density_200m

  # Capacity-factor model (M-F5-03)
  # "weibull_with_air_density": Weibull integration with air-density-corrected wind speed
  cf_model: "weibull_with_air_density"

  # Exclusion set (M-F2b-01)
  exclusions:
    - protected
    - water
    - riparian
    - slope
    - land_cover
    - population

  # Cost structure (M-F6-01)
  cost_drivers:
    - grid_connection
    - site_access

  # Uncertain parameters (U-03)
  uncertain_parameters:
    - capex_usd_per_kw
    - opex_fixed_frac
    - discount_rate
    - lifetime_years
    - degradation_rate
    - grid_cost_usd_per_mw_km
    - substation_cost_usd_per_mw
    - road_cost_usd_per_km
    - eta_loss  # Availability + wake losses

  # Parameters F5 needs (M-F5-01, M-F5-03; D-F5-011, D-F5-012). Keys of config/parameters.json
  # countries.<ISO3>.technologies.wind; a production run refuses a null value.
  # The hub height lives there (hub_height_m), no longer in this registry.
  required_parameters:
    - luf                       # M-F5-01 (OQ-004)
    - power_density_mw_per_km2  # M-F5-01 (OQ-004)
    - eta_loss                  # M-F5-03 (OQ-005)
    - hub_height_m              # M-F5-03 (OQ-005)

  # Reference power curves (M-F5-03, D-F5-003, D-F5-004): IEC class -> curve id. The table and its
  # provenance live in config/power_curves/<curve_id>.yaml. No real curve exists until OQ-005 closes.
  power_curves: null  # Pending OQ-005

  # IEC class per cell (M-F5-03, D-F5-004, D-F5-017): a siting rule, not a property of a turbine curve. The class is taken from
  # the annual mean wind speed at hub height in the reference climate and is fixed across members. A list of
  # {iec_class, mean_speed_upper_ms, source}, lowest class first, the last upper bound null (no limit); the classes must be
  # those of power_curves. All null until OQ-005 closes (the thresholds come from the IEC standard, sourced by the author).
  # (Moved here from solar 2026-09-24, ADJ-7.)
  iec_class_rule: null  # Pending OQ-005
