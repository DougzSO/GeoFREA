    technology: wind
    value: 143
    unit: GW
    source: "AMARANTE, Odilon A. Camargo do et al. Atlas do Potencial Eolico Brasileiro. Brasilia: MME/Eletrobras/CEPEL, 2001."
    year: 2001
    definition: technical
    tier: "1"
    status: registered
    premises: "50 m hub height, 1 km grid, mean wind speed above 7 m/s"
    hub_height_m: 50
