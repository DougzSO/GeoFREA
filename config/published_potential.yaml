# Published national estimates of technical potential, for the comparison table of F7b (M-F7b-03, D-F7b-004, OQ-057).
# Read only by the external_validation phase. The phase puts each estimate beside the potential of F5 at the reference member and computes
# nothing from it (no ratio, no pass or fail). A potential compared with a national target cites L-246: the scope of the target (for India
# it includes rooftop solar and does not isolate offshore wind) differs from the scope of the potential (ground-mounted and onshore).
# Each entry: country (ISO3), technology (registry id), value (null when there is no verified value), unit (GW or TWh_per_year), source, year, definition
# (technical | economic | resource | other), tier (evidence tier of the source), status (registered, or the value that marks an entry with no verified value), premises, hub_height_m
# and note (optional). `status: registered` needs a value from a verified source and a year; the other status value has `value: null` and says why in `note`.
# The values of the table of docs/thesis/methods/grupo7.tex that carry the mark vfy there have no value here. PV values are GWp (DC).
entries:
