name: Regression

# V-01 frozen regression (METHODOLOGY section 5): F1 + F2a aligned rasters and exclusions E1-E3 on the synthetic
# ZZZ country, compared with tests/fixtures/v01/zzz.npz. Everything needed is in the repository (the ZZZ fixture is
# regenerated by scripts/generate_zzz_fixture.py), so there is no external fixture download. The previous workflow
# fetched the 380 MB legacy baseline (regression-fixtures-v1); it was retired on 2026-10-06 (G-4, D-F2a-010).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoFREA (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Run V-01 regression
        run: pytest tests/regression -m regression -q
