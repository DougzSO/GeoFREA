name: Synthetic fixture (ZZZ)

# A-06/V-08: runs F1 through F5 end-to-end for the ZZZ synthetic country
# fixture (config/countries.yaml, scripts/generate_zzz_fixture.py) --
# see docs/phases/core.md D-core-018 (closing OQ-032). Separate from
# regression.yml (which runs the frozen BRA/PRT legacy-parity suite):
# this job needs no external fixture download at all -- the fixture is
# generated fresh, in-repo, on every run, and every ZZZ layer resolves
# locally via countries.yaml's synthetic_fixture_root (no network call,
# no monkeypatch -- see local_layers.py::resolve_synthetic_fetched_layer()).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    env:
      GEOFREA_DATA_DIR: ${{ github.workspace }}/.geofrea_data
      # Deliberately UNSET: ZZZ must never need GEOFREA_SHARED_RAW_DIR
      # (D-core-018) -- if a future change makes this job depend on it
      # again, that dependency itself is the regression to catch.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoFREA (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Run ZZZ end to end (F1 to F5, no network)
        # tests/synthetic generates the fixture and its miniature CMIP6, ISIMIP3b and ERA5 inputs (D13b) into a scratch
        # data directory, refuses every socket connection, and runs data_acquisition through potential_maps (A-06, V-08).
        run: pytest tests/synthetic -m synthetic -v

      - name: Run the synthetic-value separation tests
        run: pytest tests/unit/test_synthetic_value_separation.py tests/unit/test_iso3_literals.py -v
