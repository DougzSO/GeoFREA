name: Synthetic fixture (ZZZ)

# A-06/V-08: runs F1 through F5 end-to-end for the ZZZ synthetic country
# fixture (config/countries.yaml, scripts/generate_zzz_fixture.py) --
# see docs/phases/core.md D-core-018 (closing OQ-032). Separate from
# regression.yml (which runs the frozen BRA/PRT legacy-parity suite):
# this job needs no external fixture download at all -- the fixture is
# generated fresh, in-repo, on every run, and every ZZZ layer resolves
# locally via countries.yaml's synthetic_fixture_root (no network call,
# no monkeypatch -- see local_layers.py::resolve_synthetic_fetched_layer()).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    env:
      GEOFREA_DATA_DIR: ${{ github.workspace }}/.geofrea_data
      # Deliberately UNSET: ZZZ must never need GEOFREA_SHARED_RAW_DIR
      # (D-core-018) -- if a future change makes this job depend on it
      # again, that dependency itself is the regression to catch.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoFREA (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Run ZZZ end to end (F1 to F8, no network)
        # tests/synthetic generates the fixture and its miniature CMIP6, ISIMIP3b and ERA5 inputs (D13b) into a scratch
        # data directory, refuses every socket connection, and runs data_acquisition through potential_maps (A-06, V-08).
        run: pytest tests/synthetic -m synthetic -v

      - name: Run the synthetic-value separation tests
        run: pytest tests/unit/test_synthetic_value_separation.py tests/unit/test_iso3_literals.py -v

  # M-4 of the audit 2026-10 (COMMAND 39): the hand validation recomputes F3 to F7 of a finished run with numpy and scipy, importing nothing from geofrea,
  # and fails on any difference. It runs on both synthetic worlds and both technologies: ZZZ (whose cells keep their order in every future) and ZZZ2
  # (whose cells do not), wind and solar, the regret recomputation of F7 included for solar.
  hand-validation:
    runs-on: ubuntu-latest
    env:
      GEOFREA_DATA_DIR: ${{ github.workspace }}/.geofrea_data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoFREA (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Run F1 to F8 on ZZZ and ZZZ2 (the data directories are kept for the validation)
        # --basetemp keeps the module fixtures' directories: zzz_data0 (ZZZ) and zzz2_data0 (ZZZ2)
        run: >
          pytest -m synthetic -p no:cacheprovider --basetemp="$RUNNER_TEMP/runs"
          "tests/synthetic/test_zzz_end_to_end.py::test_every_phase_from_f1_to_f6_runs_and_succeeds"
          "tests/synthetic/test_zzz2_end_to_end.py::test_every_phase_from_f1_to_f8_runs_and_succeeds"

      - name: Hand validation of ZZZ and ZZZ2, wind and solar
        run: |
          mkdir -p "$RUNNER_TEMP/validation"
          status=0
          for world in "zzz:zzz_data0" "zzz2:zzz2_data0"; do
            name="${world%%:*}"; dir="${world##*:}"
            for tech in wind solar; do
              python docs/_audit/2026-10_pre_research_audit_scripts/validate_zzz_by_hand.py \
                "$RUNNER_TEMP/runs/$dir" "$tech" "$name" > "$RUNNER_TEMP/validation/${name}_${tech}.md" || status=1
              tail -n 3 "$RUNNER_TEMP/validation/${name}_${tech}.md"
            done
          done
          exit $status

      - name: Keep the validation tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-validation
          path: ${{ runner.temp }}/validation
