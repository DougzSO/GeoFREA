name: Synthetic fixture (ZZZ)

# A-06/V-08: runs F1 through F2b end-to-end for the ZZZ synthetic country
# fixture (config/countries.yaml, scripts/generate_zzz_fixture.py) --
# see docs/phases/core.md D-core-018 (closing OQ-032). Separate from
# regression.yml (which runs the frozen BRA/PRT legacy-parity suite):
# this job needs no external fixture download at all -- the fixture is
# generated fresh, in-repo, on every run, and every ZZZ layer resolves
# locally via countries.yaml's synthetic_fixture_root (no network call,
# no monkeypatch -- see local_layers.py::resolve_synthetic_fetched_layer()).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  synthetic-fixture:
    runs-on: ubuntu-latest
    env:
      GEOFREA_DATA_DIR: ${{ github.workspace }}/.geofrea_data
      # Deliberately UNSET: ZZZ must never need GEOFREA_SHARED_RAW_DIR
      # (D-core-018) -- if a future change makes this job depend on it
      # again, that dependency itself is the regression to catch.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GeoFREA (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Generate the ZZZ fixture
        run: python scripts/generate_zzz_fixture.py

      - name: Run F1 through F2b for ZZZ
        run: |
          python - <<'PYEOF'
          import sys
          import time

          from geofrea.core.config_loader import load_audit_config, load_parameters, load_settings
          from geofrea.core.orchestrator import compute_dirty, compute_run_id
          from main import _read_methodology_version, _resolved_config_json, run_geofrea

          settings = load_settings("config/settings.yaml")
          parameters = load_parameters("config/parameters.json")
          audit_config = load_audit_config("config/audit.yaml")
          methodology_version = _read_methodology_version("docs/METHODOLOGY.md")
          dirty = compute_dirty(".")
          run_id = compute_run_id(
              _resolved_config_json(settings, parameters), methodology_version, "ci"
          )

          phases = ["data_acquisition", "data_quality_audit", "grid_alignment", "suitability_criteria"]
          started = time.perf_counter()
          ok = run_geofrea(
              "ZZZ", phases, [], settings.geospatial.resolutions, audit_config, run_id, dirty
          )
          elapsed = time.perf_counter() - started
          print(f"ZZZ F1-F2b: ok={ok} elapsed={elapsed:.2f}s")
          if not ok or elapsed > 60:
              sys.exit(1)
          PYEOF

      - name: Run the synthetic-value separation tests
        run: pytest tests/unit/test_synthetic_value_separation.py tests/unit/test_iso3_literals.py -v
